name: jwt-demo

services:
  postgres:
    image: postgres:16-alpine
    container_name: jwt-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jwtdemo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    volumes:
      - jwt-demo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jwtdemo"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Tuỳ chọn: giao diện quản lý DB qua web, không bắt buộc
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jwt-demo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  jwt-demo-pgdata:
