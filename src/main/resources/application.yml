
server:
  port: 8080

spring:
  application:
    name: rehome

  # ==================== EMAIL SMTP - BREVO ====================
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  # ==================== DATABASE - POSTGRESQL ====================
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jwtdemo}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}

  # ==================== JPA / HIBERNATE ====================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ==================== SWAGGER / OPENAPI ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

# ==================== APPLICATION CONFIG ====================
app:

  # OTP
  otp:
    from: ${MAIL_FROM:the.rehome1410@gmail.com}
    ttl-seconds: 300
    resend-seconds: 60
    max-attempts: 5

  # JWT
  jwt:
    secret: ${JWT_SECRET:bG9jYWwtZGV2LW9ubHktcmVob21lLWp3dC1zZWNyZXQtMzItYnl0ZXM=}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000

# ==================== LOGGING ====================
logging:
  level:
    org.springframework.mail: DEBUG
    org.springframework.mail.javamail: DEBUG
