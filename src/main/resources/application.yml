  #         starttls:
  #           enable: true
  #           required: true
  #         connectiontimeout: 10000
  #         timeout: 10000
  #         writetimeout: 10000

  # ==================== DATABASE - POSTGRESQL (LOCAL) ====================
  datasource:
     url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jwtdemo}
     driver-class-name: org.postgresql.Driver
     username: ${DB_USERNAME:postgres}
     password: ${DB_PASSWORD:123456}

  # ==================== DATABASE - POSTGRESQL (SUPABASE - SESSION POOLER) ====================
#  datasource:
#    url: jdbc:postgresql://${DB_HOST:aws-0-ap-northeast-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}
#    driver-class-name: org.postgresql.Driver
#    username: ${DB_USERNAME:postgres.vpfbafjjimdacmgtejwz}
#    password: ${DB_PASSWORD}

  # ==================== JPA / HIBERNATE ====================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ==================== EMAIL - BREVO REST API ====================
brevo:
  api-key: ${BREVO_API_KEY}

# ==================== SWAGGER / OPENAPI ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

# ==================== APPLICATION CONFIG ====================
app:
  frontend-url:
    http://localhost:5500

  # OTP
  otp:
    from: ${MAIL_FROM:the.rehome1410@gmail.com}
    ttl-seconds: 300
    resend-seconds: 60
    max-attempts: 5

  # JWT
  jwt:
    secret: ${JWT_SECRET:bG9jYWwtZGV2LW9ubHktcmVob21lLWp3dC1zZWNyZXQtMzItYnl0ZXM=}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000

  # Order checkout - chưa tích hợp GHN, tạm phí ship cố định
  order:
    shipping-fee: 25000
    payment-deadline-minutes: 15
    tax-rate: 0

# ==================== LOGGING ====================
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: DEBUG

google:
  client-id: ${GOOGLE_CLIENT_ID}

# ==================== MOMO PAYMENT (SANDBOX) ====================
momo:
  partner-code: ${MOMO_PARTNER_CODE:MOMO}
  return-url: ${MOMO_RETURN_URL:http://localhost:3000/}
  end-point: ${MOMO_END_POINT:https://test-payment.momo.vn/v2/gateway/api}
  ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/momo/ipn-handler}
  access-key: ${MOMO_ACCESS_KEY:F8BBA842ECF85}
  secret-key: ${MOMO_SECRET_KEY:K951B6PE1waDMi640xX08PD3vg6EkVlz}
  # payWithMethod = hiện trang cho chọn Ví MoMo / ATM / VISA-Master-JCB; captureWallet = chỉ QR/app MoMo
  request-type: ${MOMO_REQUEST_TYPE:payWithMethod}
