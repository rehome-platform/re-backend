
server:
  port: 8080

spring:
  application:
    name: rehome

  # ==================== UPLOAD FILE ====================
  # Default của Spring là 1MB/file -> ảnh chụp từ điện thoại sẽ fail
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:50MB}

  # ==================== EMAIL SMTP - BREVO (KHÔNG DÙNG - PaaS thường chặn port SMTP) ====================
  # mail:
  #   host: ${MAIL_HOST:smtp-relay.brevo.com}
  #   port: ${MAIL_PORT:587}
  #   username: ${MAIL_USERNAME}
  #   password: ${MAIL_PASSWORD}
  #   properties:
  #     mail:
  #       smtp:
  #         auth: true
  #         starttls:
  #           enable: true
  #           required: true
  #         connectiontimeout: 10000
  #         timeout: 10000
  #         writetimeout: 10000

  # ==================== DATABASE - POSTGRESQL (LOCAL) ====================
  datasource:
     url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jwtdemo}
     driver-class-name: org.postgresql.Driver
     username: ${DB_USERNAME:postgres}
     password: ${DB_PASSWORD:123456}

  # ==================== DATABASE - POSTGRESQL (SUPABASE - SESSION POOLER) ====================
#  datasource:
#    url: jdbc:postgresql://${DB_HOST:aws-0-ap-northeast-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}
#    driver-class-name: org.postgresql.Driver
#    username: ${DB_USERNAME:postgres.vpfbafjjimdacmgtejwz}
#    password: ${DB_PASSWORD}

  # ==================== JPA / HIBERNATE ====================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ==================== EMAIL - BREVO REST API ====================
brevo:
  api-key: ${BREVO_API_KEY}

# ==================== SWAGGER / OPENAPI ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

# ==================== APPLICATION CONFIG ====================
app:
  storage:
    # local      = ghi vào ổ đĩa server, serve qua /files/** (CHỈ dev - Azure thay sạch wwwroot mỗi lần deploy)
    # cloudinary = upload lên Cloudinary (dùng khi deploy), cần 3 biến cloudinary.* bên dưới
    provider: ${STORAGE_PROVIDER:local}
    local-dir: ${STORAGE_LOCAL_DIR:uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/files}
    # Giới hạn ở tầng service, nên <= spring.servlet.multipart.max-file-size
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE_BYTES:10485760}
    max-files-per-request: ${STORAGE_MAX_FILES_PER_REQUEST:10}

  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

  # OTP
  otp:
    from: ${MAIL_FROM:the.rehome1410@gmail.com}
    ttl-seconds: 300
    resend-seconds: 60
    max-attempts: 5

  # JWT
  jwt:
    secret: ${JWT_SECRET:bG9jYWwtZGV2LW9ubHktcmVob21lLWp3dC1zZWNyZXQtMzItYnl0ZXM=}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000

  # Order checkout - chưa tích hợp GHN tính phí thật, tạm phí ship cố định (F-054 để sau)
  order:
    shipping-fee: 25000
    payment-deadline-minutes: 15
    tax-rate: 0
    # F-058: chu kỳ job quét đơn PENDING_PAYMENT quá hạn để tự hủy và nhả hàng về sàn
    auto-cancel-check-interval-ms: 60000
    # F-064: hạn tự hoàn thành đơn, tính từ lúc GHN báo đã giao (webhook set autoCompleteDeadline)
    auto-complete-days: 3
    # F-064 + payout người ký gửi: chu kỳ job quét đơn quá hạn autoCompleteDeadline để tự
    # chốt COMPLETED (nếu còn DELIVERED) và cộng tiền ví người ký gửi
    auto-complete-check-interval-ms: 60000

  # Trả hàng F-067 -> F-071
  return:
    # Hạn gửi yêu cầu trả hàng, tính từ lúc GHN báo đã giao
    request-window-days: 3
    # Hạn Member bàn giao hàng trả cho GHN sau khi Moderator duyệt
    handover-deadline-days: 3
    # Hạn đến kho nhận lại hàng trả bị kết luận không hợp lệ
    pickup-deadline-days: 7
    # F-069/F-071: chu kỳ job quét hai mốc hết hạn ở trên
    auto-expire-check-interval-ms: 60000

  # Rút lại hàng ký gửi giữa kỳ F-032
  item-withdrawal:
    # Hạn Member đến kho nhận lại hàng sau khi gửi yêu cầu rút, mặc định 7 ngày
    pickup-deadline-days: 7
    # Hạn trả phí rút hàng (khi feeCharged > 0); quá hạn hủy sớm, không chờ hết pickup-deadline-days
    fee-payment-deadline-minutes: 15
    # F-035: chu kỳ job quét yêu cầu quá hạn đến kho nhận hàng / quá hạn trả phí
    auto-expire-check-interval-ms: 60000

  # Chiến dịch quyên góp F-098 -> F-102
  campaign:
    # F-102: chu kỳ job quét chiến dịch còn OPEN nhưng đã qua endTime để tự đóng
    auto-close-check-interval-ms: 60000

  # Hồ sơ tổ chức
  organization:
    # F-139: chu kỳ job quét hồ sơ đã duyệt quá hạn giữ ảnh giấy tờ để xóa ảnh.
    # Số ngày giữ lấy từ system_configs (legal_image_retention_days, mặc định 30) nên
    # job chỉ cần chạy thưa; 1 giờ là đủ.
    legal-image-cleanup-check-interval-ms: 3600000

  # Push notification (F-092/F-093/F-094) qua Firebase Cloud Messaging khi app đã tắt/background -
  # WebSocket (mục websocket phía dưới dùng chung code, xem WebSocketConfig) chỉ tới được khi app
  # còn giữ kết nối. false = NoopPushNotificationServiceImpl (không cần service account thật, dùng
  # cho dev/CI). true = FcmPushNotificationServiceImpl, cần set firebase.credentials-base64.
  push:
    enabled: ${PUSH_ENABLED:false}

# ==================== LOGGING ====================
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: DEBUG

google:
  client-id: ${GOOGLE_CLIENT_ID}

# ==================== FIREBASE CLOUD MESSAGING (PUSH) ====================
# Chỉ đọc khi app.push.enabled=true. Lấy file JSON ở Firebase Console > Project Settings >
# Service accounts > Generate new private key, encode base64 (vd. `base64 -w0 key.json`),
# set vào env var FIREBASE_CREDENTIALS_BASE64 - KHÔNG commit file JSON gốc vào repo.
# credentials-path là lối thay thế cho local dev (đường dẫn file JSON trên máy), không dùng khi deploy.
firebase:
  credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

# ==================== CLOUDINARY (LƯU ẢNH/PDF) ====================
# Chỉ được đọc khi app.storage.provider=cloudinary. Lấy 3 giá trị này ở Dashboard
# Cloudinary > Settings > API Keys. api-secret là bí mật, chỉ set qua env var.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# ==================== MOMO PAYMENT (SANDBOX) ====================
momo:
  partner-code: ${MOMO_PARTNER_CODE:MOMO}
  return-url: ${MOMO_RETURN_URL:https://rehome-frontend.vercel.app/payment/momo-return}
  end-point: ${MOMO_END_POINT:https://test-payment.momo.vn/v2/gateway/api}
  ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/momo/ipn-handler}
  access-key: ${MOMO_ACCESS_KEY:F8BBA842ECF85}
  secret-key: ${MOMO_SECRET_KEY:K951B6PE1waDMi640xX08PD3vg6EkVlz}
  # payWithMethod = hiện trang cho chọn Ví MoMo / ATM / VISA-Master-JCB; captureWallet = chỉ QR/app MoMo
  request-type: ${MOMO_REQUEST_TYPE:payWithMethod}

# ==================== VNPAY PAYMENT (SANDBOX) ====================
# tmn-code/hash-secret lấy từ tài khoản merchant sandbox tự đăng ký tại https://sandbox.vnpayment.vn/devreg,
# không có giá trị demo công khai dùng chung như MoMo nên PHẢI set qua env var, không có default thật.
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  query-end-point: ${VNPAY_QUERY_ENDPOINT:https://sandbox.vnpayment.vn}
  return-url: ${VNPAY_RETURN_URL:https://rehome-frontend.vercel.app/payment/vnpay-return}
  version: ${VNPAY_VERSION:2.1.0}

rehome:
  consignment:
    bring-in-deadline-days: 7

# ==================== GHN SHIPPING (SANDBOX) - F-127/F-128 ====================
ghn:
  base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
  token: ${GHN_TOKEN:}
  shop-id: ${GHN_SHOP_ID:}
  # Product chưa có weight/length/width/height thật - dùng kích thước mặc định cho sandbox
  default-package:
    weight-grams: ${GHN_DEFAULT_WEIGHT_GRAMS:500}
    length-cm: ${GHN_DEFAULT_LENGTH_CM:30}
    width-cm: ${GHN_DEFAULT_WIDTH_CM:20}
    height-cm: ${GHN_DEFAULT_HEIGHT_CM:10}


# ==================== AI TRY-ON (CatVTON) - F-078 ====================
# AI server tự host (FastAPI). Thiếu base-url/api-key thì POST /tryon/images trả 502.
# api-key là X-API-Key của AI server (TRYON_API_KEY bên đó): PHẢI set qua env var, không commit.
tryon:
  ai:
    base-url: ${TRYON_AI_BASE_URL:}
    api-key: ${TRYON_AI_API_KEY:}
    connect-timeout-seconds: ${TRYON_AI_CONNECT_TIMEOUT_SECONDS:5}
    # AI chạy đồng bộ 2 bước diffusion (áo rồi quần), lần đầu còn nạp model: để dư
    read-timeout-seconds: ${TRYON_AI_READ_TIMEOUT_SECONDS:120}

  # Thử đồ AI real-time qua camera (Decart Lucy VTON) - giới hạn chi phí
  live:
    # Tối đa bao nhiêu lượt / ngày / account (giờ VN) - trừ ngay lúc mint token, xem LiveTryOnQuotaGuard
    daily-limit: ${TRYON_LIVE_DAILY_LIMIT:2}
    # Decart tự cắt phiên phía server họ sau đúng N giây (constraints.realtime.maxSessionDuration,
    # tối thiểu 10 theo Decart) - đây là chốt chặn thời lượng thật, không phụ thuộc client
    max-session-seconds: ${TRYON_LIVE_MAX_SESSION_SECONDS:10}
    # TTL của client token: chỉ cần đủ thời gian app mở camera + kết nối WebRTC, không phải thời lượng stream
    token-ttl-seconds: ${TRYON_LIVE_TOKEN_TTL_SECONDS:30}
    # Video 10s client ghi lại (WebM/MP4), clip 720p 10s thường chỉ 1-4MB - PHẢI <= spring.servlet.multipart.max-file-size
    max-video-size-bytes: ${TRYON_LIVE_MAX_VIDEO_SIZE_BYTES:8388608}

# ==================== DECART AI (Lucy VTON realtime) ====================
# Permanent key (dct_...) lấy ở platform.decart.ai > API keys. CHỈ set qua env var, không commit.
# Thiếu decart.api.key thì POST /tryon/live/sessions trả 502 TRYON_LIVE_TOKEN_FAILED.
decart:
  api:
    base-url: ${DECART_API_BASE_URL:https://api.decart.ai}
    key: ${DECART_API_KEY:}
  vton:
    # Ghim version cụ thể, KHÔNG dùng alias "lucy-vton-latest" để tránh bị đổi version/giá âm thầm
    model-id: ${DECART_VTON_MODEL_ID:lucy-vton-3.5}