
server:
  port: 8080

spring:
  application:
    name: rehome

  # ==================== UPLOAD FILE ====================
  # Default của Spring là 1MB/file -> ảnh chụp từ điện thoại sẽ fail
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:50MB}

  # ==================== EMAIL SMTP - BREVO (KHÔNG DÙNG - Render chặn port SMTP) ====================
  # mail:
  #   host: ${MAIL_HOST:smtp-relay.brevo.com}
  #   port: ${MAIL_PORT:587}
  #   username: ${MAIL_USERNAME}
  #   password: ${MAIL_PASSWORD}
  #   properties:
  #     mail:
  #       smtp:
  #         auth: true
  #         starttls:
  #           enable: true
  #           required: true
  #         connectiontimeout: 10000
  #         timeout: 10000
  #         writetimeout: 10000

  # ==================== DATABASE - POSTGRESQL (LOCAL) ====================
  datasource:
     url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jwtdemo}
     driver-class-name: org.postgresql.Driver
     username: ${DB_USERNAME:postgres}
     password: ${DB_PASSWORD:123456}

  # ==================== DATABASE - POSTGRESQL (SUPABASE - SESSION POOLER) ====================
#  datasource:
#    url: jdbc:postgresql://${DB_HOST:aws-0-ap-northeast-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}
#    driver-class-name: org.postgresql.Driver
#    username: ${DB_USERNAME:postgres.vpfbafjjimdacmgtejwz}
#    password: ${DB_PASSWORD}

  # ==================== JPA / HIBERNATE ====================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ==================== EMAIL - BREVO REST API ====================
brevo:
  api-key: ${BREVO_API_KEY}

# ==================== SWAGGER / OPENAPI ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

# ==================== APPLICATION CONFIG ====================
app:
  storage:
    # local      = ghi vào ổ đĩa server, serve qua /files/** (CHỈ dev - Render xóa sạch mỗi lần redeploy)
    # cloudinary = upload lên Cloudinary (dùng khi deploy), cần 3 biến cloudinary.* bên dưới
    provider: ${STORAGE_PROVIDER:local}
    local-dir: ${STORAGE_LOCAL_DIR:uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/files}
    # Giới hạn ở tầng service, nên <= spring.servlet.multipart.max-file-size
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE_BYTES:10485760}
    max-files-per-request: ${STORAGE_MAX_FILES_PER_REQUEST:10}

  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

  # OTP
  otp:
    from: ${MAIL_FROM:the.rehome1410@gmail.com}
    ttl-seconds: 300
    resend-seconds: 60
    max-attempts: 5

  # JWT
  jwt:
    secret: ${JWT_SECRET:bG9jYWwtZGV2LW9ubHktcmVob21lLWp3dC1zZWNyZXQtMzItYnl0ZXM=}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000

  # Order checkout - chưa tích hợp GHN tính phí thật, tạm phí ship cố định (F-054 để sau)
  order:
    shipping-fee: 25000
    payment-deadline-minutes: 15
    tax-rate: 0
    # F-058: chu kỳ job quét đơn PENDING_PAYMENT quá hạn để tự hủy và nhả hàng về sàn
    auto-cancel-check-interval-ms: 60000
    # F-064: hạn tự hoàn thành đơn, tính từ lúc GHN báo đã giao (webhook set autoCompleteDeadline)
    auto-complete-days: 3

  # Trả hàng F-067 -> F-071
  return:
    # Hạn gửi yêu cầu trả hàng, tính từ lúc GHN báo đã giao
    request-window-days: 3
    # Hạn Member bàn giao hàng trả cho GHN sau khi Moderator duyệt
    handover-deadline-days: 3
    # Hạn đến kho nhận lại hàng trả bị kết luận không hợp lệ
    pickup-deadline-days: 7
    # F-069/F-071: chu kỳ job quét hai mốc hết hạn ở trên
    auto-expire-check-interval-ms: 60000

# ==================== LOGGING ====================
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: DEBUG

google:
  client-id: ${GOOGLE_CLIENT_ID}

# ==================== CLOUDINARY (LƯU ẢNH/PDF) ====================
# Chỉ được đọc khi app.storage.provider=cloudinary. Lấy 3 giá trị này ở Dashboard
# Cloudinary > Settings > API Keys. api-secret là bí mật, chỉ set qua env var.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# ==================== MOMO PAYMENT (SANDBOX) ====================
momo:
  partner-code: ${MOMO_PARTNER_CODE:MOMO}
  return-url: ${MOMO_RETURN_URL:https://rehome-frontend.vercel.app/payment/momo-return}
  end-point: ${MOMO_END_POINT:https://test-payment.momo.vn/v2/gateway/api}
  ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/momo/ipn-handler}
  access-key: ${MOMO_ACCESS_KEY:F8BBA842ECF85}
  secret-key: ${MOMO_SECRET_KEY:K951B6PE1waDMi640xX08PD3vg6EkVlz}
  # payWithMethod = hiện trang cho chọn Ví MoMo / ATM / VISA-Master-JCB; captureWallet = chỉ QR/app MoMo
  request-type: ${MOMO_REQUEST_TYPE:payWithMethod}

# ==================== VNPAY PAYMENT (SANDBOX) ====================
# tmn-code/hash-secret lấy từ tài khoản merchant sandbox tự đăng ký tại https://sandbox.vnpayment.vn/devreg,
# không có giá trị demo công khai dùng chung như MoMo nên PHẢI set qua env var, không có default thật.
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  query-end-point: ${VNPAY_QUERY_ENDPOINT:https://sandbox.vnpayment.vn}
  return-url: ${VNPAY_RETURN_URL:https://rehome-frontend.vercel.app/payment/vnpay-return}
  version: ${VNPAY_VERSION:2.1.0}

rehome:
  consignment:
    bring-in-deadline-days: 7

# ==================== GHN SHIPPING (SANDBOX) - F-127/F-128 ====================
ghn:
  base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
  token: ${GHN_TOKEN:}
  shop-id: ${GHN_SHOP_ID:}
  # Product chưa có weight/length/width/height thật - dùng kích thước mặc định cho sandbox
  default-package:
    weight-grams: ${GHN_DEFAULT_WEIGHT_GRAMS:500}
    length-cm: ${GHN_DEFAULT_LENGTH_CM:30}
    width-cm: ${GHN_DEFAULT_WIDTH_CM:20}
    height-cm: ${GHN_DEFAULT_HEIGHT_CM:10}
